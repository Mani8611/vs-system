# Kinder-Stick: Fensterregeln für GNOME Kiosk (siehe CONFIG.md von gnome-kiosk).
# Ersetzt die Beispieldatei des Pakets. Alle Abschnitte werden der Reihe nach angewendet.

# Alle normalen Programmfenster im Vollbild öffnen (Dialoge und Menüs nicht)
[programme]
match-window-type=normal
set-fullscreen=true

# Kleiner „Fertig“-Knopf über Netflix/Disney+ (videofenster): nicht Vollbild, immer oben links
[fertig-knopf]
match-title=Kinderstick-Fertig
set-fullscreen=false
set-above=true
set-x=16
set-y=16

# Aus der Paket-Vorlage übernommen
[notifications]
match-tag=gnome-kiosk-notification
set-x=0
set-y=0
set-fullscreen=false
set-above=true

[kiosk-menu]
match-tag=gnome-kiosk-menu
match-window-type=normal
set-window-type=desktop
set-fullscreen=true
