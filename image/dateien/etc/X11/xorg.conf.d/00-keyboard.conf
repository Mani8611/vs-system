# Kinder-Stick: Tastatur Deutsch (Österreich), ohne Tottasten.
# Wird von systemd-localed gelesen; gnome-kiosk übernimmt das Layout daraus, falls die
# GNOME-Einstellung (dconf, /etc/dconf/db/local.d/00-kinderstick) nicht greift.
# Test 27.11.2026: Im Browser kam kein „@“ (AltGr+Q) – die Sitzung lief mit US-Layout.
Section "InputClass"
        Identifier "system-keyboard"
        MatchIsKeyboard "on"
        Option "XkbLayout" "at"
        Option "XkbVariant" "nodeadkeys"
EndSection
