<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kinder-Stick</title>
  <link rel="stylesheet" href="stil.css">
</head>
<body class="kind">
  <header class="kopf">
    <h1 id="gruss">Hallo!</h1>
    <div class="zeit" aria-live="polite">
      <div class="zeit-text" id="zeit-text"></div>
      <div class="balken"><div class="balken-fuellung" id="balken"></div></div>
    </div>
  </header>

  <main id="kacheln" class="kacheln" aria-label="Deine Programme"></main>

  <section id="sperre" class="sperre" hidden aria-live="polite">
    <div class="sperre-symbol" id="sperre-symbol"></div>
    <h2 id="sperre-titel"></h2>
    <p id="sperre-text"></p>
    <div id="sperre-apps" class="sperre-apps"></div>
  </section>

  <div class="unten-links">
    <button id="aus-knopf" class="rund-knopf" type="button" title="Computer ausschalten" aria-label="Computer ausschalten">⏻</button>
    <button id="hg-knopf" class="rund-knopf" type="button" title="Hintergrund aussuchen" aria-label="Hintergrund aussuchen">🖼️</button>
    <button id="ton-knopf" class="rund-knopf" type="button" title="Lautstärke" aria-label="Lautstärke">🔊</button>
  </div>
  <button id="eltern-knopf" class="eltern-knopf" type="button" title="Für Mama und Papa" aria-label="Eltern-Bereich">🔒</button>

  <dialog id="aus-dialog" aria-labelledby="aus-titel">
    <h2 class="pin-titel" id="aus-titel">Computer ausschalten?</h2>
    <div class="dialog-knoepfe">
      <button class="knopf" type="button" id="aus-ja">Ja, ausschalten</button>
      <button class="knopf zweit" type="button" id="aus-nein">Nein</button>
    </div>
  </dialog>

  <dialog id="hg-dialog" class="hg-dialog" aria-labelledby="hg-titel">
    <h2 class="pin-titel" id="hg-titel">Such dir einen Hintergrund aus</h2>
    <div class="hg-galerie" id="hg-galerie"></div>
    <button class="pin-abbrechen" id="hg-schliessen" type="button">Schließen</button>
  </dialog>

  <dialog id="ton-dialog" class="ton-dialog" aria-labelledby="ton-titel">
    <h2 class="pin-titel" id="ton-titel">Wie laut?</h2>
    <div class="ton-reihe">
      <span aria-hidden="true">🔈</span>
      <input id="ton-regler" class="ton-regler" type="range" min="0" max="100" step="5" aria-label="Lautstärke">
      <span aria-hidden="true">🔊</span>
    </div>
    <p class="ton-hinweis" id="ton-hinweis">Kopfhörer mit Kabel einstecken – der Ton kommt dann von selbst dort heraus.</p>
    <button class="pin-abbrechen" id="ton-schliessen" type="button">Schließen</button>
  </dialog>

  <div id="oeffnen-hinweis" class="aus-hinweis" hidden aria-live="polite">
    <div class="sperre-symbol" id="oeffnen-symbol"></div>
    <h2 id="oeffnen-titel"></h2>
    <p>Einen Moment …</p>
  </div>

  <div id="aus-hinweis" class="aus-hinweis" hidden>
    <div class="sperre-symbol">👋</div>
    <h2>Tschüss!</h2>
    <p>Der Computer schaltet sich aus. Danach kannst du den Stick abziehen.</p>
    <p class="aus-fehler" id="aus-fehler" hidden></p>
  </div>

  <dialog id="pin-dialog" aria-labelledby="pin-titel">
    <h2 class="pin-titel" id="pin-titel">Eltern-PIN</h2>
    <div class="pin-anzeige" id="pin-anzeige"></div>
    <p class="pin-fehler" id="pin-fehler"></p>
    <div class="pin-tasten" id="pin-tasten"></div>
    <button class="pin-abbrechen" id="pin-abbrechen" type="button">Abbrechen</button>
  </dialog>

  <script src="vorschau.js"></script>
  <script src="gemeinsam.js"></script>
  <script src="start.js"></script>
</body>
</html>
