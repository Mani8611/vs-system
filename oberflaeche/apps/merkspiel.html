<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merkspiel</title>
  <link rel="stylesheet" href="../stil.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="merkspiel.css">
</head>
<body class="kind-app">
  <header class="app-kopf">
    <button id="zurueck" class="zurueck-knopf" type="button">⬅ Fertig</button>
    <h1>🧠 Merkspiel</h1>
    <div class="app-kopf-rechts"><span class="sterne" id="zuege">Züge: 0</span></div>
  </header>

  <main class="app-inhalt" id="auswahl">
    <h2 class="wahl-titel">Wie viele Karten?</h2>
    <div class="wahl-karten" id="wahl-karten"></div>
  </main>

  <main class="app-inhalt" id="spiel" hidden>
    <div class="feld" id="feld"></div>
  </main>

  <main class="app-inhalt" id="ende" hidden>
    <div class="geschafft">
      <div class="gross">🏆</div>
      <h2>Alle Paare gefunden!</h2>
      <p id="ende-text"></p>
      <button class="knopf-gross" type="button" id="nochmal">Nochmal</button>
      <button class="knopf-gross zweit" type="button" id="andere">Andere Größe</button>
    </div>
  </main>

  <script src="../vorschau.js"></script>
  <script src="../gemeinsam.js"></script>
  <script src="app.js"></script>
  <script src="merkspiel.js"></script>
</body>
</html>
