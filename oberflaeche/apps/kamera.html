<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kamera</title>
  <link rel="stylesheet" href="../stil.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="kamera.css">
</head>
<body class="kind-app">
  <header class="app-kopf">
    <button id="zurueck" class="zurueck-knopf" type="button">⬅ Fertig</button>
    <h1 id="titel">Kamera</h1>
    <div class="app-kopf-rechts">
      <button id="menue" class="kopf-knopf" type="button" title="Zur Auswahl" aria-label="Zur Auswahl" hidden>🏠</button>
      <span class="sterne" id="punkte" hidden></span>
      <span class="sterne" id="uhr" hidden></span>
    </div>
  </header>

  <!-- Auswahl -->
  <main class="app-inhalt" id="auswahl">
    <h2 class="wahl-titel">Was möchtest du spielen?</h2>
    <div class="wahl-karten">
      <button class="wahl-karte farbe-2" type="button" data-modus="blasen">
        <span class="gross">🫧</span>Blasen platzen<span class="klein">Wedle mit den Händen!</span>
      </button>
      <button class="wahl-karte farbe-4" type="button" data-modus="spiegel">
        <span class="gross">🪄</span>Zauberspiegel<span class="klein">Lustige Fotos machen</span>
      </button>
      <button class="wahl-karte farbe-3" type="button" data-modus="fotos">
        <span class="gross">🖼️</span>Meine Fotos<span class="klein">Anschauen und aussuchen</span>
      </button>
    </div>
  </main>

  <!-- Keine Kamera -->
  <main class="app-inhalt" id="keine-kamera" hidden>
    <div class="geschafft">
      <div class="gross">📷</div>
      <h2>Keine Kamera gefunden</h2>
      <p id="kamera-fehler">Dieser Computer hat keine Kamera, oder sie ist gerade ausgeschaltet.</p>
      <button class="knopf-gross" type="button" id="keine-zurueck">Zurück</button>
    </div>
  </main>

  <!-- Bühne für Blasen und Zauberspiegel -->
  <main class="kamera-buehne" id="buehne" hidden>
    <div class="kamera-rahmen" id="rahmen">
      <canvas id="bild" aria-label="Kamerabild"></canvas>
      <div class="countdown" id="countdown" hidden></div>
      <div class="blitz" id="blitz" hidden></div>
      <div class="start-hinweis" id="start-hinweis" hidden></div>
    </div>
    <aside class="spiegel-leiste" id="spiegel-leiste" hidden>
      <div class="effekte" id="effekte" aria-label="Zaubereffekte"></div>
      <div class="sticker" id="sticker" aria-label="Sticker"></div>
      <div class="spiegel-knoepfe">
        <button class="kopf-knopf hell" type="button" id="sticker-weg" title="Alle Sticker weg" aria-label="Alle Sticker weg">🧽</button>
        <button class="foto-knopf" type="button" id="foto" title="Foto machen" aria-label="Foto machen">📸</button>
      </div>
    </aside>
  </main>

  <!-- Ende einer Blasen-Runde -->
  <main class="app-inhalt" id="ende" hidden>
    <div class="geschafft">
      <div class="gross">🫧</div>
      <h2 id="ende-titel"></h2>
      <p id="ende-text"></p>
      <button class="knopf-gross" type="button" id="nochmal">Nochmal</button>
      <button class="knopf-gross zweit" type="button" id="ende-menue">Andere Spiele</button>
    </div>
  </main>

  <!-- Meine Fotos -->
  <main class="app-inhalt" id="fotos" hidden>
    <h2 class="wahl-titel">Meine Fotos</h2>
    <p class="bilder-leer" id="fotos-leer">Noch keine Fotos. Im Zauberspiegel kannst du mit 📸 Fotos machen.</p>
    <div class="foto-liste" id="foto-liste"></div>
  </main>

  <dialog id="foto-dialog" class="foto-dialog">
    <img id="foto-gross" alt="Dein Foto">
    <div class="app-dialog-knoepfe">
      <button class="knopf-gross" type="button" id="foto-hintergrund">🏞️ Als Hintergrund</button>
      <button class="knopf-gross zweit" type="button" id="foto-loeschen">🗑️ Wegwerfen</button>
    </div>
    <button class="pin-abbrechen" type="button" id="foto-zu">Schließen</button>
  </dialog>

  <div class="gespeichert" id="hinweis" hidden></div>

  <video id="video" class="kamera-video" playsinline muted></video>

  <script src="../vorschau.js"></script>
  <script src="../gemeinsam.js"></script>
  <script src="app.js"></script>
  <script src="kamera.js"></script>
</body>
</html>
